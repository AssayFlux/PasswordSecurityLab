[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assayflux-password-security-lab"
version = "0.1.0"
description = "Offline-first educational password security research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AssayFlux" }]
dependencies = ["argon2-cffi>=23.1", "bcrypt>=4.1", "rich>=13.7"]

[project.optional-dependencies]
tui = ["textual>=0.70"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7", "textual>=0.70"]

[project.scripts]
apsl = "apsl.cli:main"

[tool.setuptools.packages.find]
include = ["apsl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
